name: budgetr
description: A budget tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  intl: 0.20.3
  cupertino_icons: ^1.0.6
  logger: ^2.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/flags/
